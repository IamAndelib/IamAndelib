<style>
.bn-bg{fill:#e9f7ec} .bn-water{fill:#d6efdc}
.bn-ripple{fill:none;stroke:#9bd3a8;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ripple 6s ease-out infinite}
.r2{animation-delay:2s} .r3{animation-delay:4s}
.bn-pad{fill:#3fb950} .bn-vein{stroke:#2a8a3c;stroke-width:3;fill:none}
.bn-name{fill:#1f2328;font:800 54px -apple-system, 'Segoe UI', 'Noto Sans', Ubuntu, Helvetica, Arial, sans-serif;letter-spacing:-.5px}
